[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-trader-api"
version = "0.2.0"
description = "Isolated, capability-gated Agent Portfolio trading service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography==46.0.3",
  "dbzero-pro==0.6.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.1",
]

[project.scripts]
trader = "trader_api.cli:main"
trader-admin = "trader_api.admin_cli:main"
trader-worker = "trader_api.ipc:worker_main"

[tool.hatch.build.targets.wheel]
packages = ["trader_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["external_demo: requires explicitly enabled eToro demo credentials"]

[tool.coverage.run]
branch = true
source = ["trader_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["trader_api"]
exclude = ["tests"]

[tool.uv.sources]
dbzero-pro = { path = "../dbzero-pro/tmp/py313-current-wheel/dbzero_pro-0.6.4-cp313-cp313-linux_x86_64.whl" }
